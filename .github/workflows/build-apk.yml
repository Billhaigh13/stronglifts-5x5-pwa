name: Build Android APK

on:
  push:
    branches: ['dev', 'test', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION for branch ${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK binaries
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/StrongLifts-5x5.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/StrongLifts-5x5-Test.apk

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrongLifts-5x5-${{ github.ref_name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # -------------------------------------------------------------
      # TEST BRANCH: Publish Pre-Release (Beta / Testing)
      # -------------------------------------------------------------
      - name: Create Test Pre-Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/test'
        with:
          files: release-assets/StrongLifts-5x5-Test.apk
          tag_name: v${{ env.APP_VERSION }}-test
          name: StrongLifts 5x5 Test Build (v${{ env.APP_VERSION }}-test)
          body: |
            🧪 **Pre-Release Test Build**
            - Branch: `test`
            - Commit: `${{ github.sha }}`
            - Test this APK on your device before merging to `main`.
          draft: false
          prerelease: true
          generate_release_notes: true

      # -------------------------------------------------------------
      # MAIN BRANCH: Publish Official Production Release
      # -------------------------------------------------------------
      - name: Create Production Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: release-assets/StrongLifts-5x5.apk
          tag_name: v${{ env.APP_VERSION }}
          name: StrongLifts 5x5 v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
